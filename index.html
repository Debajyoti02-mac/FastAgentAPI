<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastAgent Console</title>
<style>
  :root {
    --bg: #0d1116;
    --panel: #151a21;
    --panel-alt: #10151b;
    --border: #232a33;
    --text: #e6e9ec;
    --muted: #8a94a6;
    --accent: #46b8a6;
    --accent-strong: #2f8f80;
    --error: #e06c5f;
    --success: #6fcf97;
    --radius: 10px;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"] {
    --bg: #f5f6f4;
    --panel: #ffffff;
    --panel-alt: #eef0ef;
    --border: #dde1e6;
    --text: #1b2027;
    --muted: #5b6472;
    --accent: #2f8f80;
    --accent-strong: #1f6459;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }

  #shell {
    display: flex;
    height: 100vh;
    max-width: 1080px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel-alt);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 20px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.2s; }
  .dot.ok { background: var(--success); } .dot.bad { background: var(--error); }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: var(--mono);
  }
  .conn-line { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-bottom: 4px; }
  .conn-line b { color: var(--text); }

  .tool-list { display: flex; flex-direction: column; gap: 6px; }
  .tool-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .tool-row .dot { background: var(--success); }

  .quick-actions { display: flex; flex-direction: column; gap: 6px; }
  .side-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    font-family: var(--sans);
  }
  .side-btn:hover { border-color: var(--accent); }

  #sidebar-footer { margin-top: auto; }
  #sidebar-footer .icon-btn { width: 100%; }

  /* ---------- Main column ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #menuToggle { display: none; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 82%; padding: 10px 13px; border-radius: var(--radius);
    line-height: 1.45; font-size: 14px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #06231f; border-bottom-right-radius: 3px; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; font-family: var(--mono); background: none; padding: 4px; }
  .msg.error { align-self: flex-start; background: transparent; border: 1px solid var(--error); color: var(--error); font-family: var(--mono); font-size: 13px; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
  #composer textarea {
    flex: 1; resize: none; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); padding: 10px 12px; font-size: 14px; font-family: var(--sans);
    max-height: 120px; min-height: 40px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  .round-btn {
    background: var(--accent); color: #06231f; border: none; border-radius: 10px;
    width: 40px; height: 40px; flex-shrink: 0; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .round-btn.secondary { background: none; border: 1px solid var(--border); color: var(--muted); }
  .round-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  footer {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  footer a { color: var(--muted); }

  /* ---------- Settings drawer ---------- */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-start; justify-content: center; z-index: 20; }
  #overlay.open { display: flex; }
  #drawer { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 60px; width: min(360px, 92vw); padding: 18px; }
  #drawer h2 { margin: 0 0 14px; font-size: 15px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-family: var(--mono); }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: var(--mono); }
  .field input:focus { outline: none; border-color: var(--accent); }
  .drawer-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn { flex: 1; padding: 9px; border-radius: 7px; border: 1px solid var(--border); background: none; color: var(--text); cursor: pointer; font-size: 13px; font-family: var(--sans); }
  .btn.primary { background: var(--accent); color: #06231f; border: none; }

  #log::-webkit-scrollbar { width: 6px; } #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px) {
    #sidebar {
      position: fixed; inset: 0 20% 0 0; z-index: 15;
      transform: translateX(-100%); transition: transform 0.2s ease;
      width: auto; border-right: 1px solid var(--border);
    }
    #sidebar.open { transform: translateX(0); }
    #menuToggle { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
<div id="shell">

  <aside id="sidebar">
    <div class="brand"><span class="dot" id="statusDot"></span> FastAgent</div>

    <div>
      <div class="section-label">Connection</div>
      <div class="conn-line">URL: <b id="dispUrl">not set</b></div>
      <div class="conn-line">Thread: <b id="dispThread">default</b></div>
    </div>

    <div>
      <div class="section-label">Tools</div>
      <div class="tool-list">
        <div class="tool-row"><span class="dot"></span> Calculator</div>
        <div class="tool-row"><span class="dot"></span> Weather</div>
        <div class="tool-row"><span class="dot"></span> Web Search</div>
        <div class="tool-row"><span class="dot"></span> File Handler</div>
      </div>
    </div>

    <div>
      <div class="section-label">Quick actions</div>
      <div class="quick-actions">
        <button class="side-btn" id="historyBtn">🕘 History</button>
        <button class="side-btn" id="dbBtn">⬇ Download DB</button>
        <button class="side-btn" id="fileBtn">📄 Get file</button>
        <button class="side-btn" id="attachBtn">📎 Upload PDF</button>
      </div>
    </div>

    <div id="sidebar-footer">
      <button class="icon-btn" id="settingsBtn" style="width:100%">⚙ Settings</button>
    </div>
  </aside>

  <div id="main">
    <header>
      <button class="icon-btn" id="menuToggle">☰</button>
      <strong style="font-size:14px;">Chat</strong>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
    </header>

    <div id="log"></div>

    <form id="composer">
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
      <textarea id="input" placeholder="Ask the agent..." rows="1"></textarea>
      <button type="submit" class="round-btn" id="sendBtn" title="Send">➤</button>
    </form>

    <footer>
      <span id="footerStatus">not connected</span>
      <a id="docsLink" href="#" target="_blank" rel="noopener">API docs ↗</a>
    </footer>
  </div>

</div>

<div id="overlay">
  <div id="drawer">
    <h2>Connection</h2>
    <div class="field"><label>Base URL</label><input id="baseUrl" placeholder="https://fastagentapi-2.onrender.com"></div>
    <div class="field"><label>x-api-key</label><input id="apiKey" type="password" placeholder="your api key"></div>
    <div class="field"><label>thread_id</label><input id="threadId" placeholder="default"></div>
    <div class="drawer-actions">
      <button class="btn" id="cancelSettings">Cancel</button>
      <button class="btn primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const log = $('log');

  const state = {
    baseUrl: localStorage.getItem('fa_baseUrl') || '',
    apiKey: localStorage.getItem('fa_apiKey') || '',
    threadId: localStorage.getItem('fa_threadId') || 'default',
  };

  function refreshSidebarInfo() {
    $('dispUrl').textContent = state.baseUrl || 'not set';
    $('dispThread').textContent = state.threadId;
    $('docsLink').href = state.baseUrl ? state.baseUrl + '/docs' : '#';
  }
  refreshSidebarInfo();

  const savedTheme = localStorage.getItem('fa_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  $('themeToggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('fa_theme', next);
  };

  $('menuToggle').onclick = () => $('sidebar').classList.toggle('open');
  log.addEventListener('click', () => $('sidebar').classList.remove('open'));

  function openSettings() {
    $('baseUrl').value = state.baseUrl;
    $('apiKey').value = state.apiKey;
    $('threadId').value = state.threadId;
    $('overlay').classList.add('open');
  }
  $('settingsBtn').onclick = openSettings;
  $('cancelSettings').onclick = () => $('overlay').classList.remove('open');
  $('saveSettings').onclick = () => {
    state.baseUrl = $('baseUrl').value.trim().replace(/\/$/, '');
    state.apiKey = $('apiKey').value.trim();
    state.threadId = $('threadId').value.trim() || 'default';
    localStorage.setItem('fa_baseUrl', state.baseUrl);
    localStorage.setItem('fa_apiKey', state.apiKey);
    localStorage.setItem('fa_threadId', state.threadId);
    $('overlay').classList.remove('open');
    refreshSidebarInfo();
    addSystem('Connection settings saved.');
    checkStatus();
  };

  if (!state.baseUrl) {
    setTimeout(openSettings, 300);
    addSystem('Set your API base URL and key to get started.');
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }
  function addSystem(text) { addMsg('system', text); }
  function addError(text) { addMsg('error', text); }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function hideTyping() { const el = $('typingIndicator'); if (el) el.remove(); }

  async function apiFetch(path, options = {}) {
    if (!state.baseUrl) throw new Error('No base URL configured. Open Settings.');
    const headers = Object.assign({ 'x-api-key': state.apiKey }, options.headers || {});
    const res = await fetch(state.baseUrl + path, { ...options, headers });
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = j.detail || detail; } catch (_) {}
      throw new Error(`${res.status}: ${detail}`);
    }
    return res;
  }

  async function checkStatus() {
    try {
      await apiFetch('/ask');
      $('statusDot').className = 'dot ok';
      $('footerStatus').textContent = 'connected';
    } catch (_) {
      $('statusDot').className = 'dot bad';
      $('footerStatus').textContent = 'disconnected';
    }
  }
  if (state.baseUrl) checkStatus();

  const form = $('composer');
  const input = $('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    addMsg('user', question);
    input.value = ''; input.style.height = 'auto';
    $('sendBtn').disabled = true;
    showTyping();
    try {
      const res = await apiFetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, thread_id: state.threadId, limit: 100 }),
      });
      const data = await res.json();
      hideTyping();
      addMsg('agent', data.answer);
      $('statusDot').className = 'dot ok';
      $('footerStatus').textContent = 'connected';
    } catch (err) {
      hideTyping();
      addError(err.message);
      $('statusDot').className = 'dot bad';
      $('footerStatus').textContent = 'disconnected';
    } finally {
      $('sendBtn').disabled = false;
    }
  });

  $('attachBtn').onclick = () => $('pdfInput').click();
  $('pdfInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    addSystem(`Uploading ${file.name}...`);
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await apiFetch('/upload-pdf', { method: 'POST', body: fd });
      const data = await res.json();
      addSystem(`Indexed ${file.name} — ${data.chunks_added} chunks added.`);
    } catch (err) {
      addError('Upload failed: ' + err.message);
    }
    e.target.value = '';
  };

  $('historyBtn').onclick = async () => {
    addSystem('Loading history...');
    try {
      const res = await apiFetch('/ask');
      const items = await res.json();
      if (!items.length) { addSystem('No history yet.'); return; }
      items.slice(-10).forEach((it) => {
        addMsg('user', it.question);
        addMsg('agent', it.answer);
      });
    } catch (err) {
      addError('Could not load history: ' + err.message);
    }
  };

  async function downloadBlob(path, filename) {
    const res = await apiFetch(path);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  $('dbBtn').onclick = async () => {
    addSystem('Downloading database...');
    try { await downloadBlob('/download-db', 'database.db'); addSystem('Database downloaded.'); }
    catch (err) { addError('Download failed: ' + err.message); }
  };

  $('fileBtn').onclick = async () => {
    const name = prompt('Filename in agent_files/:');
    if (!name) return;
    try { await downloadBlob('/files/' + encodeURIComponent(name), name); addSystem(`Downloaded ${name}.`); }
    catch (err) { addError('Could not fetch file: ' + err.message); }
  };
})();
</script>
</body>
</html>
